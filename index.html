<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Anna Bosshard — Social Psychology</title>
<meta name="description" content="Anna Bosshard, PhD candidate in Social Psychology at the University of Amsterdam. Consumption reduction and support for large-scale climate action." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --paper:      #fcfcfa;
    --paper-warm: #f2f3ec;
    --olive:      #4b5636;   /* primary ink / intro + footer */
    --olive-soft: #77815f;   /* muted meta   */
    --ink:        #2c2f26;   /* body text    */
    --red:        #b0362b;   /* hover / focus accent */
    --rule:       #dcded4;   /* hairlines / leaders */

    --wrap: 720px;
    --font: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; scroll-padding-top: 80px; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font);
    font-size: 17px;
    font-weight: 400;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  a { color: inherit; }

  :focus-visible {
    outline: 2px solid var(--red);
    outline-offset: 3px;
    border-radius: 2px;
  }

  .wrap { width: 100%; max-width: var(--wrap); margin: 0 auto; padding: 0 28px; }

  /* ---------- top nav ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
  }
  .topbar .wrap { display: flex; align-items: center; gap: 20px; height: 58px; }
  .brand {
    display: flex; align-items: center; gap: 9px;
    font-weight: 500; font-size: .98rem; letter-spacing: .01em;
    color: var(--olive); text-decoration: none; white-space: nowrap;
  }
  .brand .mark { font-weight: 700; font-size: 1.15rem; line-height: 1; color: var(--olive); }
  nav.links {
    margin-left: auto; display: flex; gap: 22px;
    overflow-x: auto; -ms-overflow-style: none; scrollbar-width: none;
  }
  nav.links::-webkit-scrollbar { display: none; }
  nav.links a {
    font-size: .72rem; font-weight: 500; letter-spacing: .11em;
    text-transform: uppercase; color: var(--olive-soft);
    text-decoration: none; white-space: nowrap; padding: 4px 0;
    border-bottom: 1.5px solid transparent; transition: color .18s, border-color .18s;
  }
  nav.links a:hover { color: var(--olive); border-color: var(--red); }

  /* ---------- intro (olive) ---------- */
  .hero { background: var(--olive); color: var(--paper); padding: 46px 0 54px; }
  .hero-inner { text-align: left; }
  .monogram {
    font-size: clamp(3.2rem, 10vw, 5rem); font-weight: 300; line-height: 1;
    letter-spacing: .02em; color: var(--paper); margin: 0 0 20px;
  }
  .hero .eyebrow {
    font-size: .74rem; font-weight: 500; letter-spacing: .19em;
    text-transform: uppercase; color: color-mix(in srgb, var(--paper) 80%, transparent);
    margin: 0 0 16px;
  }
  .hero h1 {
    font-weight: 500; font-size: clamp(1.9rem, 5vw, 2.8rem);
    line-height: 1.05; letter-spacing: -.02em; margin: 0; color: var(--paper);
  }
  .hero .role {
    font-weight: 400; font-size: clamp(1.02rem, 3vw, 1.22rem);
    color: color-mix(in srgb, var(--paper) 90%, transparent); margin: 16px 0 0;
  }
  .hero .thesis {
    font-size: .78rem; font-weight: 500; letter-spacing: .05em; text-transform: uppercase;
    color: color-mix(in srgb, var(--paper) 66%, transparent); margin: 22px 0 0;
  }
  .hero-mail {
    display: inline-block; margin-top: 24px;
    font-size: .84rem; letter-spacing: .02em; color: var(--paper);
    text-decoration: none; padding-bottom: 2px;
    border-bottom: 1.5px solid color-mix(in srgb, var(--paper) 40%, transparent);
    transition: border-color .18s;
  }
  .hero-mail:hover { border-color: var(--paper); }

  /* ---------- sections ---------- */
  section.course { padding: 42px 0; }
  .head { display: flex; align-items: baseline; gap: 14px; margin: 0 0 24px; }
  .head h2 {
    font-weight: 500; font-size: 1.5rem; letter-spacing: -.01em;
    color: var(--olive); margin: 0;
  }
  .head .rule { flex: 1; height: 1px; background: var(--rule); }

  /* ---------- footer ---------- */
  footer { margin-top: 34px; background: var(--olive); color: var(--paper-warm); }
  footer .wrap { padding: 50px 28px 44px; text-align: center; }
  footer .f-eye { font-size: .72rem; font-weight: 500; letter-spacing: .19em; text-transform: uppercase; color: color-mix(in srgb, var(--paper-warm) 68%, transparent); margin: 0 0 16px; }
  footer .f-mail { font-size: clamp(1rem, 3.2vw, 1.25rem); font-weight: 500; color: var(--paper); text-decoration: none; border-bottom: 1.5px solid transparent; }
  footer .f-mail:hover { border-color: var(--red); }
  footer .f-links { margin-top: 24px; display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; font-size: .92rem; letter-spacing: .03em; }
  footer .f-links a { color: color-mix(in srgb, var(--paper-warm) 84%, transparent); text-decoration: none; border-bottom: 1px solid transparent; }
  footer .f-links a:hover { border-color: var(--red); color: var(--paper); }
  footer .colophon { margin-top: 30px; font-size: .7rem; color: color-mix(in srgb, var(--paper-warm) 52%, transparent); letter-spacing: .03em; }

  /* ---------- responsive ---------- */
  @media (max-width: 620px) {
    body { font-size: 16px; }
    .head h2 { font-size: 1.32rem; }
  }
</style>
</head>

<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="#top">Anna Bosshard</a>
    <nav class="links" aria-label="Sections">
      <a href="#about">About</a>
      <a href="#publications">Publications</a>
      <a href="#talks">Talks</a>
      <a href="#teaching">Teaching</a>
      <a href="#funding">Funding</a>

    </nav>
  </div>

<main id="top">

  <!-- INTRO -->
  <section class="hero">
    <div class="wrap hero-inner">
      <h1>Anna Bosshard</h1>
      <p class="role">PhD candidate in Social Psychology</p>
      <a class="hero-mail" href="mailto:a.bosshard@uva.nl">a.bosshard@uva.nl</a>
    </div>
  </section>

  <!-- ABOUT -->
  <section class="course" id="about">
    <div class="wrap">
      <div class="head"><h2>About</h2><span class="rule"></span></div>
    </div>
  </section>

  <!-- PUBLICATIONS -->
  <section class="course" id="publications">

      <div class="head"><h2>Publications</h2><span class="rule"></span></div>

  </section>

  <!-- TALKS -->
  <section class="course" id="talks">

  </section>

  <!-- TEACHING -->

  </section>

</main>

<!-- FOOTER -->
<footer id="contact">
  <div class="wrap">
    <a class="f-mail" href="mailto:a.bosshard@uva.nl">a.bosshard@uva.nl</a>
    <div class="f-links">
      <a href="https://scholar.google.com/citations?user=kVr-e_4AAAAJ&amp;hl=nl&amp;oi=ao" target="_blank" rel="noopener">Google Scholar</a>
      <a href="https://orcid.org/0000-0002-2095-1116" target="_blank" rel="noopener">ORCID</a>

    </div>
  </div>
</footer>

</body>
</html>
